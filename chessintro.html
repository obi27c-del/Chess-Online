<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style type="text/css">

            .container {
                display: grid;
                grid-template-columns: 3fr 2fr;
                height: 100vh;
            }

            .leftSide {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1rem;
                border: 1px solid black;
            }

            .rightSide {
                background: lightyellow;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: 1rem;
                border: 2px solid black;
            }
            .formTitle{
                text-align: center;
                font-size: 28px;
                font-weight: bold;
                background: gray; 
                padding: 12px 20px;
                border-radius: 10px;
                color: white;
                margin-bottom: 20px;
                border: 2px solid black
            }
           .form {
                width: 100%;
                text-align: center;
            }

            #submit {
                display: inline-block;
                text-align: center;
                font-size: 28px;
                font-weight: bold;
                background: gray; 
                padding: 12px 20px;
                border-radius: 10px;
                color: white;
                margin-top: 10px;
                border: 2px solid black;
            }

            #submit:hover {
                color:black
            }


            input[type="radio"] {
                display: none;
            }

            .group {
                display: flex;
                flex-direction: column;
                gap: 12px;          /* space between buttons */
                margin-bottom: 32px; /* space between groups */
        }

            label {
                display: block;
                max-width: 350px; 
                width: 100%;
                margin: 0 auto;         
                padding: 7px 10px;   
                background: #dcdcdc;
                border: 3px solid black;
                border-radius: 18px;    
                font-size: 14px;
                text-align: center;
                cursor: pointer;
                transition: 0.2s;
                }


            label:hover {
                background: #c8c8c8;
            }
            input[type="radio"]:checked + label {
                background: #ffa3a3;         
                font-weight: bold;
                border-color: black;
            }

            #chessboard {
                display: grid;
                grid-template-columns: repeat(8, 85px);
                grid-template-rows: repeat(8, 85px);
                border: 2px solid black;
                width: fit-content;
            }

            .square {
                width: 85px;
                height: 85px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                cursor: pointer;
            }

            .light {
                background-color: #eee;
            }

            .dark {
                background-color: #888;
            }


        </style>
    </head>

    <body>  
        <div class="container"> 
            <div class="leftSide">
                 <div id="chessboard"></div>

                 <script>
                    const board = document.getElementById("chessboard");
                    const rows = ['A','B','C','D','E','F','G','H'];
                    const cols = [1,2,3,4,5,6,7,8];

                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {

                            const square = document.createElement("div");
                            square.classList.add("square");

                            if ((r + c) % 2 === 0) square.classList.add("light");
                            else square.classList.add("dark");

                            const squareID = rows[r] + cols[c];
                            square.id = squareID;

                            square.addEventListener("click", () => {
                                console.log("Clicked square:", squareID);
                            });

                            board.appendChild(square);
                        }
                    }
                </script>
            </div>

            <div class="rightSide">
                <form class="form" action="/chess/game">

                    <div class="formTitle">Design A Game</div>

                    <div class="group" id="diffOptions">
                        <strong>Bot Difficulty:</strong>

                        <input name="difficulty" id="easy" value="easy" type="radio"> 
                        <label for="easy">Easy</label>

                        <input name="difficulty" id="medium" value="medium" type="radio"> 
                        <label for="medium">Medium</label>

                        <input name="difficulty" id="hard" value="hard" type="radio"> 
                        <label for="hard">Hard</label>
                    
                    </div>

                    <div class="group" id="posOptions">
                        <strong>Player Position:</strong>

                        <input name="position" id="black" value="black" type="radio"> 
                        <label for="black">Black</label>

                        <input name="position" id="white" value="white" type="radio"> 
                        <label for="white">White</label>

                        <input name="position" id="random" value="random" type="radio"> 
                        <label for="random">Random</label>
                    </div>


                    <div class="group" id="timeOptions">
                        <strong> Time Options: </strong>

                         <input name="time" id="five" value="five" type="radio"> 
                        <label for="five">5:00 minutes</label>

                        <input name="time" id="fifteen" value="fifteen" type="radio"> 
                        <label for="fifteen">15:00 minutes</label>

                        <input name="time" id="thirty" value="thirty" type="radio"> 
                        <label for="thirty">30:00 minutes</label>
                    </div>
                    

                    <button id="submit" type="submit" disabled="disabled">Create Game!</button>
                </form>
            </div>
        </div>
        
    </body>
</html>
