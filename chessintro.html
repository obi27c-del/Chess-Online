<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Online</title>
    <style>
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
            font: bold 1.5rem Arial, sans-serif;
            width: 100%;
            border-radius: 5px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, Segoe UI, Roboto, Arial;
            background: #f6f6f6;
            position: relative;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }



        form.options {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            background-color: gray;
            width: min(420px, 40vw);
            padding: 1rem;
            border: solid black .3rem;
            box-sizing: border-box;
        }

        .option.flex {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: .25rem 0;
        }

        label {
            margin: 0 1rem;
            font-size: 1.2rem;
            border: black solid .1rem;
        }

        button {
            padding: 10px;
            font-size: 2em;
            margin: 10px;
            border-radius: 10px;
        }

        div.option {
            padding: 0.5em;
            flex-grow: 1;
            font-size: 2em;
        }

        div.option>input {
            font-size: 1em;
            padding: 5px;

            border-radius: 10px;
        }

        div.option>input[type='number'] {
            width: 5ch;
            margin-left: auto;
        }

        div.option.grid {
            display: grid;
            grid-template-areas:
                "name number"
                "range range";
        }

        div.option>input[type='range'] {
            grid-area: range;
        }

        div.option.flex {
            display: flex;
            justify-content: space-around;
        }

        div.option>label {
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;
            border: 2px solid black;
            border-radius: 10px;

        }

        div.option>input[type='radio'] {
            display: none;
        }

        div.option>input[type='radio']:checked+label {

            background: #dfe0df;
            color: black;
        }

        .board-bg {
            pointer-events: none;
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: -1;
        }


        .board {
            width: min(95vw, 95vh);
            aspect-ratio: 1/1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-auto-rows: 1fr;
            gap: 0px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }


        .tile {
            width: 100%;
            height: 100%;

        }

        .tile.light {
            background: #eeeed2;
        }

        .tile.dark {
            background: #8d4d2a;
        }


        main {

            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0
        }

        p.lead {
            color: #444
        }
    </style>
</head>

<body>

    <div class="board-bg">
        <div id="board" class="board"></div>
    </div>

    <!-- WHEN WE MAKE OUR 2ND DOC CHANGE ACTION HERE -->
    <form class="options" action="/chess-online/game">

        <div class="option">
            <header>Chess Online!</header>

        </div>

        <div class="option flex">
            <input name='gametype' id='random' type="radio" value="random" />
            <label for="random">Playing a Random Opponent</label>
            <input name='gametype' id='friend' type="radio" value="friend" />
            <label for="friend">Playing a Friend</label>

        </div>
        <button id="play" type="submit" disabled="disabled">Play Game!</button>
    </form>


    <script>

        (function () {
            let cols = 8;
            let rows = 8;
            let board = document.getElementById('board');


            board.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile ' + (((r + c) % 2 === 0) ? 'light' : 'dark');
                    board.appendChild(tile);
                }
            }
            let radios = document.querySelectorAll("input[name='gametype']");
            let button = document.getElementById('play');

            function updateButtonState() {
                button.disabled = !Array.from(radios).some(r => r.checked);
            }


            updateButtonState();
            radios.forEach(r => r.addEventListener('change', updateButtonState));
        })();
    </script>
</body>

</html>
