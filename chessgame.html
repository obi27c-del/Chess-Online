<!doctype html>
<html lang="en">

<head>
<style type="text/css"> 

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-image: url("image.jpg");  
        background-size: cover;        
        background-position: center; 
        background-repeat: no-repeat; 
    }
    
    #chessboard {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 2px solid black;
    width: fit-content;
    }

    .square {
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
    }

    .light {
        background-color: #eee;
    }

    .dark {
        background-color: #888;
    }

</style>
</head>
<body>
<div id="chessboard"></div>
<script type="module">
    import { images } from '/images.js'
    const board = document.getElementById("chessboard")
    const rows = ['A','B','C','D','E','F','G','H']
    const cols = [1,2,3,4,5,6,7,8]

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {

            const square = document.createElement("div");
            square.classList.add("square");

            if ((r + c) % 2 === 0) square.classList.add("light"); //pretty sure formula works, double check
            else square.classList.add("dark");

            // ID
            const squareID = rows[r] + cols[c];
            const squareCoord = r.toString() + c.toString();
            square.id = squareID;

            // Listener
            square.addEventListener("click", () => onClick(square.id));

            board.appendChild(square);
        }
    }

    (async () => {
    const res = await fetch("/chess/game/state");
    const data = await res.json();
    generate(data.board);
    })();// did this annoyingness because await can't be there without being in an async.

    function onClick(id) {
    console.log("Clicked:", id);
}

// renders ui
function generate(boardState) {
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const squareId = rows[r] + cols[c];
            const square = document.getElementById(squareId);
            const piece = boardState[r][c];
            square.innerHTML = "";

            if (piece !== null && images[piece]) {
                const img = document.createElement("img");
                img.src = images[piece]
                img.classList.add("piece");
                square.appendChild(img)
            }
        }
    }
}

</script>

</body>
